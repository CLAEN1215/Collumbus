[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "collumbus"
dynamic = ["version"]
description = "Beginner-friendly, read-only AWS cloud configuration auditor"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "annotated-types==0.8.0",
    "boto3==1.43.118",
    "pydantic==2.14.1",
    "pydantic_core==2.50.1",
    "PyYAML==6.0.3",
    "streamlit==1.66.1",
    "typing-inspection==0.4.4",
    "typing_extensions==4.16.0",
]

[project.scripts]
collumbus = "collumbus.cli:main"

[tool.setuptools.dynamic]
version = { attr = "collumbus.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/W/F: style and errors, I: import order, B: bug patterns, UP: modern syntax,
# S: security checks (Bandit rules built into Ruff)
select = ["E", "W", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# pytest uses plain `assert` statements
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pandas.*", "streamlit.*"]
ignore_missing_imports = true
